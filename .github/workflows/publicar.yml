name: Publicar

# A cada push na main, gera o LuminiTray.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.24.1), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish LuminiTray/LuminiTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          if (Test-Path LuminiTray/LEIA-ME.txt) { Copy-Item LuminiTray/LEIA-ME.txt dist/LEIA-ME.txt }
          if (Test-Path LuminiTray/Assets/Plugins) { Copy-Item -Recurse LuminiTray/Assets/Plugins dist/Assets/Plugins }
          Compress-Archive -Path dist/* -DestinationPath LuminiTray.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release delete latest --cleanup-tag --yes
          gh release create latest LuminiTray.zip dist/LuminiTray.exe --target $env:GITHUB_SHA --latest --title "Lumini Tray (versão mais recente)" --notes-file CHANGELOG.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME LuminiTray.zip dist/LuminiTray.exe --title "Lumini Tray $env:GITHUB_REF_NAME" --generate-notes --latest=false
