name: Publicar

# A cada push na main, gera o LuminiTray.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.24.2), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar (arquivo único, com o .NET embutido)
        shell: pwsh
        run: |
          dotnet publish LuminiTray/LuminiTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          if (Test-Path LuminiTray/LEIA-ME.txt) { Copy-Item LuminiTray/LEIA-ME.txt dist/LEIA-ME.txt }
          if (Test-Path LuminiTray/Assets/Plugins) { Copy-Item -Recurse LuminiTray/Assets/Plugins dist/Assets/Plugins }
          Compress-Archive -Path dist/* -DestinationPath LuminiTray.zip

          # Preparar notas da release exclusivas da versão atual (apenas a seção ## [X.Y.Z])
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw
            $versionTag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
            $regex = if ($versionTag) { "(?ms)##\s*\[$([regex]::Escape($versionTag))\].*?(?=##\s*\[|\Z)" } else { "(?ms)##\s*\[.*?\].*?(?=##\s*\[|\Z)" }
            if ($raw -match $regex) {
              $notes = $matches[0].Trim() + "`n`n---`n*Consulte o [CHANGELOG.md](https://github.com/JamalG21/LuminiTray/blob/main/CHANGELOG.md) completo para o histórico de versões anteriores.*"
            } elseif ($raw.Length -gt 60000) {
              $notes = $raw.Substring(0, 60000) + "`n`n---`n*Consulte o [CHANGELOG.md](https://github.com/JamalG21/LuminiTray/blob/main/CHANGELOG.md) completo para o histórico de versões anteriores.*"
            } else {
              $notes = $raw
            }
            [System.IO.File]::WriteAllText("release-notes.md", $notes, [System.Text.Encoding]::UTF8)
          } else {
            [System.IO.File]::WriteAllText("release-notes.md", "Release Lumini Tray", [System.Text.Encoding]::UTF8)
          }

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete latest --cleanup-tag --yes 2>$null
          $ErrorActionPreference = 'Stop'
          gh release create latest LuminiTray.zip dist/LuminiTray.exe --target $env:GITHUB_SHA --latest --title "Lumini Tray (versão mais recente)" --notes-file release-notes.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME LuminiTray.zip dist/LuminiTray.exe --title "Lumini Tray $env:GITHUB_REF_NAME" --notes-file release-notes.md --latest=true
