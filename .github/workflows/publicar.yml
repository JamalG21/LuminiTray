name: Publicar

# A cada push na main, gera o LuminiTray.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.24.2), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publicar (arquivo único, com o .NET embutido)
        shell: pwsh
        run: |
          dotnet publish LuminiTray/LuminiTray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo
          dotnet publish LuminiTray.Installer/LuminiTray.Installer.csproj -c Release -o dist-installer -nologo

      - name: Assinar digitalmente (Lumini Tray)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Lumini Tray, O=Lumini Tray" -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(3)
          foreach ($f in @('dist/LuminiTray.exe', 'dist-installer/LuminiTray-Installer.exe')) {
            $sig = $null
            try { $sig = Set-AuthenticodeSignature -FilePath $f -Certificate $cert -HashAlgorithm SHA256 -TimestampServer 'http://timestamp.digicert.com' } catch {}
            if (-not $sig -or $sig.Status -eq 'HashMismatch' -or -not $sig.SignerCertificate) {
              $sig = Set-AuthenticodeSignature -FilePath $f -Certificate $cert -HashAlgorithm SHA256
            }
            Write-Host "Assinatura de ${f}: $($sig.Status) ($($sig.SignerCertificate.Subject))"
          }

      - name: Montar pacotes
        shell: pwsh
        run: |
          if (Test-Path LuminiTray/LEIA-ME.txt) { Copy-Item LuminiTray/LEIA-ME.txt dist/LEIA-ME.txt }
          if (Test-Path LuminiTray/Assets/Plugins) { Copy-Item -Recurse LuminiTray/Assets/Plugins dist/Assets/Plugins }
          Compress-Archive -Path dist/* -DestinationPath LuminiTray-Portable.zip
          Copy-Item dist/LuminiTray.exe LuminiTray-Portable.exe
          Copy-Item dist-installer/LuminiTray-Installer.exe LuminiTray-Installer.exe

          # Preparar notas da release contendo todas as changelogs acima da última versão publicada
          if (Test-Path CHANGELOG.md) {
            $raw = Get-Content CHANGELOG.md -Raw
            $allTags = git tag -l "v*" --sort=-v:refname | Where-Object { $_ -ne 'latest' }
            $currentTag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith('v')) { $env:GITHUB_REF_NAME } elseif ($allTags) { $allTags | Select-Object -First 1 } else { '' }
            $prevTags = $allTags | Where-Object { $_ -ne $currentTag }
            $prevVer = if ($prevTags) { ($prevTags | Select-Object -First 1).TrimStart('v') } else { '' }
            if ($prevVer -and $raw -match "(?ms)(##\s*\[.*?)(?=##\s*\[$([regex]::Escape($prevVer))\]|\Z)") {
              $notes = $matches[1].Trim() + "`n`n---`n*Consulte o [CHANGELOG.md](https://github.com/JamalG21/LuminiTray/blob/main/CHANGELOG.md) completo para o histórico de versões anteriores.*"
            } elseif ($raw -match "(?ms)##\s*\[.*?\].*?(?=##\s*\[|\Z)") {
              $notes = $matches[0].Trim() + "`n`n---`n*Consulte o [CHANGELOG.md](https://github.com/JamalG21/LuminiTray/blob/main/CHANGELOG.md) completo para o histórico de versões anteriores.*"
            } else {
              $notes = $raw
            }
            $table = "## Downloads`n`n| Arquivo | Tipo | Descrição |`n|---|---|---|`n| ``LuminiTray-Installer.exe`` | **Instalador** | Instalador web leve: baixa a versão mais recente e instala com atalhos e desinstalador |`n| ``LuminiTray-Portable.exe`` | **Portátil (único)** | Executável único, roda direto sem instalar |`n| ``LuminiTray-Portable.zip`` | **Portátil (completo)** | Executável + plugins de papel de parede + LEIA-ME |`n`n---`n`n"; [System.IO.File]::WriteAllText("release-notes.md", $table + $notes, [System.Text.Encoding]::UTF8)
          } else {
            [System.IO.File]::WriteAllText("release-notes.md", "Release Lumini Tray", [System.Text.Encoding]::UTF8)
          }

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete latest --cleanup-tag --yes 2>$null
          $ErrorActionPreference = 'Stop'
          gh release create latest LuminiTray-Installer.exe LuminiTray-Portable.exe LuminiTray-Portable.zip --target $env:GITHUB_SHA --latest --title "Lumini Tray (versão mais recente)" --notes-file release-notes.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete $env:GITHUB_REF_NAME --yes 2>$null
          $ErrorActionPreference = 'Stop'
          gh release create $env:GITHUB_REF_NAME LuminiTray-Installer.exe LuminiTray-Portable.exe LuminiTray-Portable.zip --title "Lumini Tray $env:GITHUB_REF_NAME" --notes-file release-notes.md --latest=true
